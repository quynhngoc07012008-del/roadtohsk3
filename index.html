<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hán Tự Ký Ức (汉字记忆)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif; }
        .hanzi-grid {
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 25% 25%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">🏮 Hán Tự Ký Ức</h1>
            <p class="text-slate-600">Hệ thống luyện nhớ 146+ Hán tự và cấu trúc câu thông minh</p>
        </header>

        <!-- Thanh điều hướng tab -->
        <div class="flex flex-wrap justify-center gap-2 mb-6 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
            <button onclick="switchTab('home')" id="btn-home" class="px-4 py-2 rounded-xl font-medium text-sm bg-indigo-600 text-white transition">🏠 Trang chủ</button>
            <button onclick="switchTab('flashcard')" id="btn-flashcard" class="px-4 py-2 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-100 transition">👁️ Học thẻ</button>
            <button onclick="switchTab('add')" id="btn-add" class="px-4 py-2 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-100 transition">➕ Thêm từ</button>
        </div>

        <!-- Nội dung các Tab -->
        <main>
            <!-- Tab Trang chủ -->
            <div id="tab-home" class="space-y-6">
                <div class="bg-gradient-to-br from-indigo-500 to-violet-600 text-white p-6 rounded-3xl shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <span class="text-indigo-200 text-sm font-medium">Chuỗi học tập (Streak)</span>
                            <h2 class="text-3xl font-bold" id="streak-count">🔥 1 Ngày</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-indigo-200 text-sm font-medium">Đã thuộc</span>
                            <h2 class="text-3xl font-bold" id="mastered-count">0 / 147</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab Học thẻ -->
            <div id="tab-flashcard" class="hidden space-y-6">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 text-center max-w-lg mx-auto">
                    <div class="hanzi-grid w-36 h-36 mx-auto mb-6 border-2 border-indigo-200 rounded-2xl flex items-center justify-center text-6xl font-bold text-slate-800 shadow-inner" id="card-hanzi">
                        你好
                    </div>
                    <p class="text-xl font-semibold text-indigo-600 mb-2" id="card-pinyin">nǐ hǎo</p>
                    <p class="text-slate-600 mb-6" id="card-meaning">Xin chào</p>
                    <div class="flex justify-center gap-4">
                        <button onclick="prevCard()" class="px-5 py-2.5 rounded-xl border border-slate-200 font-medium hover:bg-slate-50">⬅️ Từ trước</button>
                        <button onclick="nextCard()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700">Từ tiếp ➡️</button>
                    </div>
                </div>
            </div>

            <!-- Tab Thêm từ (Offline Thông Minh) -->
            <div id="tab-add" class="hidden space-y-6">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 max-w-lg mx-auto">
                    <h3 class="text-xl font-bold mb-4 text-slate-800">➕ Thêm Hán tự mới</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nhập Pinyin (VD: nǐ hǎo)</label>
                            <input type="text" id="input-pinyin" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nhập pinyin...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nhập Nghĩa Tiếng Việt</label>
                            <input type="text" id="input-meaning" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nhập nghĩa...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Chữ Hán tương ứng (Hệ thống tự nhận diện hoặc bạn điền thêm)</label>
                            <input type="text" id="input-hanzi" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ví dụ: 你好">
                        </div>
                        <button onclick="addNewWord()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition shadow-md shadow-indigo-100">Lưu vào từ vựng</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let vocabList = [
            { hanzi: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
            { hanzi: "谢谢", pinyin: "xiè xiè", meaning: "Cảm ơn" },
            { hanzi: "再见", pinyin: "zài jiàn", meaning: "Tạm biệt" }
        ];

        let currentIndex = 0;

        function switchTab(tabId) {
            ['home', 'flashcard', 'add'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-4 py-2 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-100 transition";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).className = "px-4 py-2 rounded-xl font-medium text-sm bg-indigo-600 text-white transition";
            if(tabId === 'flashcard') renderCard();
        }

        function renderCard() {
            if(vocabList.length === 0) return;
            const item = vocabList[currentIndex];
            document.getElementById('card-hanzi').innerText = item.hanzi;
            document.getElementById('card-pinyin').innerText = item.pinyin;
            document.getElementById('card-meaning').innerText = item.meaning;
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % vocabList.length;
            renderCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + vocabList.length) % vocabList.length;
            renderCard();
        }

        function addNewWord() {
            const pinyin = document.getElementById('input-pinyin').value.trim();
            const meaning = document.getElementById('input-meaning').value.trim();
            const hanzi = document.getElementById('input-hanzi').value.trim() || "待";

            if(!pinyin || !meaning) {
                alert("Vui lòng nhập đầy đủ Pinyin và Nghĩa tiếng Việt!");
                return;
            }

            vocabList.push({ hanzi, pinyin, meaning });
            alert("Đã thêm từ vựng thành công vào bộ nhớ!");
            document.getElementById('input-pinyin').value = '';
            document.getElementById('input-meaning').value = '';
            document.getElementById('input-hanzi').value = '';
            document.getElementById('mastered-count').innerText = `${vocabList.length} tổng số`;
        }
    </script>
</body>
</html>
