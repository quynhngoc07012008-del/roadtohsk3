<!DOCTYPE html>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter for UI, Noto Sans SC & Ma Shan Zheng for crisp Hanzi -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            hanzi: ['"Noto Sans SC"', '"KaiTi"', '"STKaiti"', 'serif'],
          },
          colors: {
            paper: '#FAF8F5',
            paperDark: '#F2EFE9',
            ink: '#1E2022',
            inkLight: '#525860',
            seal: '#C83E3B',
            sealHover: '#B0322F',
            jade: '#2E7D5B',
            jadeLight: '#E8F3EE',

  <style>
    body {
      background-color: #FAF8F5;
      color: #1E2022;
      background-image: radial-gradient(#E5E0D8 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F2EFE9;
    }
    ::-webkit-scrollbar-thumb {
      background: #D1C9BC;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B5ACA0;
    }

    /* Animations */
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.3s ease-in-out;
    }

    /* Traditional Seal Stamp Style */
    .seal-badge {
      border: 1.5px solid #C83E3B;
      color: #C83E3B;
      box-shadow: inset 0 0 0 1px rgba(200, 62, 59, 0.15);
    }

    /* Hanzi Tianzige (Grid Box) background for big character display */
    .tianzige {
      background-color: #FFFFFF;
      background-image:

</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-seal selection:text-white">

    function getSheetMeta() {
      const all = getAllVocab();
      const meta = [
        { id: 'all', label: `Tất cả (${all.length} từ)` },
        { id: 1, label: 'Trang 1: Chào hỏi' },
        { id: 2, label: 'Trang 2: Gia đình' },

        meta.push({ id: 6, label: `📝 Từ tự nhập (${state.customWords.length})` });
      }
      meta.push({ id: 'starred', label: '⭐ Hay nhầm / Đánh dấu' });
      return meta;

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
          state.customWords = Array.isArray(saved.customWords) ? saved.customWords : [];
          state.masteredIds = new Set(saved.masteredIds || []);
          state.starredIds = new Set(saved.starredIds || []);
          state.streak = saved.streak || 0;
          state.bestStreak = saved.bestStreak || state.streak;
          state.totalAnswered = saved.totalAnswered || 0;
          state.totalCorrect = saved.totalCorrect || 0;
        }
      } catch (e) {
        console.warn("Could not load saved progress:", e);
      }
    }

    function saveProgress() {
      if (state.streak > state.bestStreak) {
        state.bestStreak = state.streak;
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          customWords: state.customWords,
          masteredIds: Array.from(state.masteredIds),
          starredIds: Array.from(state.starredIds),
          streak: state.streak,
          bestStreak: state.bestStreak,
          totalAnswered: state.totalAnswered,
          totalCorrect: state.totalCorrect
        }));
      } catch (e) {
        console.warn("Could not save progress:", e);
      }
      updateHeaderStats();
    }

    function autoStarWord(id) {
      if (!state.starredIds.has(id)) {
        state.starredIds.add(id);
        renderScopeFilters();
      }
    }

      const list = [...generateSentencesForWord(targetWord)];
      state.cachedSentences = list.reverse();
      renderCurrentMode();
    }

        if (type === 'Nghi vấn') return 'bg-blue-100 text-blue-700 border-blue-200';
        if (type === 'Phủ định') return 'bg-red-100 text-seal border-red-200';

      return `

    /**
     * ============================================================================
     * 4. AUDIO (WEB SPEECH API CHINESE TTS) & HELPERS
     * ============================================================================
     */
    function speakHanzi(text) {
      if (!('speechSynthesis' in window)) {
        showToast("Trình duyệt không hỗ trợ phát âm tự động.", "warning");
        return;
      }
      window.speechSynthesis.cancel();
      // Clean ellipsis like 太...了 -> 太了 for natural speech
      const cleanText = text.replace(/\.\.\./g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85; // Slightly slower for clear learner comprehension
      window.speechSynthesis.speak(utterance);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        info: 'bg-ink text-white',
        success: 'bg-jade text-white',
        warning: 'bg-amber-600 text-white',
        error: 'bg-seal text-white'
      };
      toast.className = `${colors[type] || colors.info} px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium animate-pop flex items-center gap-2`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function getFilteredDeck() {
      const all = getAllVocab();
      if (state.currentScope === 'all') return [...all];
      if (state.currentScope === 'starred') {
        const starred = all.filter(item => state.starredIds.has(item.id));
        return starred.length > 0 ? starred : [];
      }
      return all.filter(item => item.sheet === state.currentScope);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

     * ============================================================================
     * 5. HEADER & FILTER BAR RENDERING
     * ============================================================================
     */
    function updateHeaderStats() {
      const total = getAllVocab().length;
      document.getElementById('stat-mastered').textContent = state.masteredIds.size;

      const subEl = document.getElementById('header-vocab-subtitle');
      if (subEl) subEl.textContent = `${total} từ vựng • Tự động lưu tiến độ`;
      document.getElementById('stat-streak').textContent = state.streak;
      const acc = state.totalAnswered === 0 ? 100 : Math.round((state.totalCorrect / state.totalAnswered) * 100);
      document.getElementById('stat-accuracy').textContent = `${acc}%`;
    }

    function renderScopeFilters() {
      const container = document.getElementById('scope-filters');
      container.innerHTML = getSheetMeta().map(meta => {

    function setScope(scope) {
      state.currentScope = scope;
      renderScopeFilters();
      initModeData();
      renderCurrentMode();

    function switchMode(mode) {
      if (state.matchInterval) {
        clearInterval(state.matchInterval);
        state.matchInterval = null;
      }
      state.currentMode = mode;
      // Update tab styles
      document.querySelectorAll('.mode-tab').forEach(btn => {
        btn.classList.remove('bg-white', 'text-seal', 'shadow-sm', 'border-seal');
        btn.classList.add('text-inkLight');

      const activeBtn = document.getElementById(`tab-${mode}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-seal', 'shadow-sm');
        activeBtn.classList.remove('text-inkLight');

      initModeData();
      renderCurrentMode();

    function initModeData() {
      const deck = getFilteredDeck();
      if (state.currentMode === 'quiz-hanzi' || state.currentMode === 'quiz-reverse') {
        const unmastered = shuffleArray(deck.filter(w => !state.masteredIds.has(w.id)));
        const mastered = shuffleArray(deck.filter(w => state.masteredIds.has(w.id)));
        state.sessionQueue = [...unmastered, ...mastered];
        nextQuestion();
      } else if (state.currentMode === 'translate') {
        initTranslateQueue();
      } else if (state.currentMode === 'write-hanzi') {
        const unmastered = shuffleArray(deck.filter(w => !state.masteredIds.has(w.id)));
        const mastered = shuffleArray(deck.filter(w => state.masteredIds.has(w.id)));
        state.sessionQueue = [...unmastered, ...mastered];
        nextWriteWord();
      } else if (state.currentMode === 'match-game') {
        setupMatchGame();
      }

     * 6. QUIZ MODES: HANZI RECOGNITION & HANZI HUNT (NHẬN DIỆN & SĂN TÌM HÁN TỰ)
     * ============================================================================
     */
    function toggleStar(id, event) {
      if (event) event.stopPropagation();
      if (state.starredIds.has(id)) {
        state.starredIds.delete(id);
        showToast("Đã bỏ đánh dấu sao", "info");
      } else {
        state.starredIds.add(id);
        showToast("Đã lưu vào mục ⭐ Hay nhầm / Đánh dấu", "warning");
      }
      saveProgress();
      renderScopeFilters();
      renderCurrentMode();
    }

    function toggleMastered(id, event) {
      if (event) event.stopPropagation();
      if (state.masteredIds.has(id)) {
        state.masteredIds.delete(id);
      } else {
        state.masteredIds.add(id);
      }
      saveProgress();
      renderCurrentMode();
    }

    function nextQuestion() {
      const deck = getFilteredDeck();
      if (deck.length === 0) {
        state.currentQuestion = null;
        return;
      }

      if (state.sessionQueue.length === 0) {
        state.sessionQueue = shuffleArray(deck);
      }

      const target = state.sessionQueue.shift();
      state.quizAnswered = false;
      state.showHint = false;
      state.showSentences = false;

      // Determine whether this question asks for Pinyin or Vietnamese Meaning
      let askType = state.quizPromptType;
      if (askType === 'auto') {
        askType = (state.totalAnswered % 2 === 0) ? 'pinyin' : 'meaning';
      }

      // Build 3 smart distractors (prioritizing look-alike confusable characters!)
      const allVocab = getAllVocab();
      const distractors = [];
      const usedIds = new Set([target.id]);

      if (target.confusables && target.confusables.length > 0) {
        for (const confHanzi of shuffleArray(target.confusables)) {
          const found = allVocab.find(w => w.hanzi === confHanzi && !usedIds.has(w.id));
          if (found) {
            distractors.push(found);
            usedIds.add(found.id);
          }
          if (distractors.length >= 3) break;
        }
      }

      // Fill remaining slots from general pool
      const fallbackPool = shuffleArray(allVocab.filter(w => !usedIds.has(w.id)));
      while (distractors.length < 3 && fallbackPool.length > 0) {
        const candidate = fallbackPool.pop();
        if (!usedIds.has(candidate.id)) {
          distractors.push(candidate);
          usedIds.add(candidate.id);
        }
      }

      const options = shuffleArray([target, ...distractors]);

      state.currentQuestion = {
        target,
        askType,
        options,
        selectedId: null
      };
    }

    function handleQuizAnswer(selectedId) {
      if (state.quizAnswered || !state.currentQuestion) return;

      const q = state.currentQuestion;
      q.selectedId = selectedId;
      state.quizAnswered = true;
      state.totalAnswered++;

      const isCorrect = selectedId === q.target.id;
      speakHanzi(q.target.hanzi);

      if (isCorrect) {
        state.totalCorrect++;
        state.streak++;
        state.masteredIds.add(q.target.id);
      } else {
        state.streak = 0;
        // Automatically star missed word and re-insert into queue soon
        autoStarWord(q.target.id);
        state.masteredIds.delete(q.target.id);
        const reinsertIdx = Math.min(2, state.sessionQueue.length);
        state.sessionQueue.splice(reinsertIdx, 0, q.target);
        showToast(`Sai rồi! Tự động gắn sao ⭐ cho từ "${q.target.hanzi}"`, "warning");
      }

      saveProgress();
      renderCurrentMode();
    }

    function setQuizPromptType(type) {
      state.quizPromptType = type;
      nextQuestion();
      renderCurrentMode();
    }

    function renderQuizTopBar(target) {

              Linh hoạt
            </button>
            <button onclick="setQuizPromptType('pinyin')" class="px-2.5 py-1 rounded-lg font-medium transition ${state.quizPromptType === 'pinyin' ? 'bg-white text-seal shadow-sm' : 'text-inkLight hover:text-ink'}">

          <span class="px-2.5 py-1 rounded-xl border text-xs font-bold ${isStarred ? 'bg-amber-50 border-amber-300 text-amber-600' : 'bg-stone-50 border-stone-200 text-stone-400'}" title="Tự động gắn sao khi trả lời sai">
            ${isStarred ? '⭐ Đã gắn sao' : '☆ Chưa sai'}

    // MODE 1: Show Big Hanzi -> User recalls Pinyin or Vietnamese Meaning
    function renderQuizHanzi(viewport) {

    function normalizePinyin(str) {
      return str
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // strip tone marks so user can type either with or without tone marks
        .replace(/ü/g, 'v')
        .replace(/[^a-z0-9]/g, '');
    }

    function normalizeHanzi(str) {
      return str.replace(/[\s.,?!。，？！…]/g, '');
    }

    function initTranslateQueue() {
      const deck = getFilteredDeck();
      const items = [];

      // Mix single words from the active filtered deck + curated sentences matching scope
      deck.forEach(w => {
        items.push({
          wordId: w.id,
          hanzi: w.hanzi.replace(/\.\.\./g, ''),
          pinyin: w.pinyin.split('/')[0].trim(),
          vi: w.meaning,
          isSentence: false
        });
      });

      const deckIds = new Set(deck.map(w => w.id));
      TRANSLATION_SENTENCES.forEach(s => {
        if (state.currentScope === 'all' || deckIds.has(s.wordId)) {
          items.push({ ...s, isSentence: true });
        }
      });

      state.translateQueue = shuffleArray(items);
      nextTranslateItem();
    }

    function nextTranslateItem() {
      if (state.translateQueue.length === 0) {
        initTranslateQueue();
        return;
      }
      const item = state.translateQueue.shift();
      let dir = state.translateModeType;
      if (dir === 'auto') {
        const dirs = ['hanzi-to-pinyin', 'vi-to-pinyin', 'vi-to-hanzi'];
        dir = dirs[state.totalAnswered % 3];
      }

      state.currentTranslateItem = { ...item, direction: dir };
      state.translateUserInput = '';
      state.translateSubmitted = false;
      state.translateIsCorrect = false;
    }

    function insertToneChar(ch) {
      const input = document.getElementById('translate-input');
      if (!input) return;
      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      input.value = input.value.slice(0, start) + ch + input.value.slice(end);
      state.translateUserInput = input.value;
      input.focus();
      input.setSelectionRange(start + ch.length, start + ch.length);
    }

    function submitTranslateAnswer() {
      if (state.translateSubmitted || !state.currentTranslateItem) return;
      const item = state.currentTranslateItem;
      const rawInput = (document.getElementById('translate-input')?.value || state.translateUserInput).trim();

      if (!rawInput) {
        showToast("Bạn hãy nhập câu trả lời trước khi kiểm tra nhé!", "warning");
        return;
      }

      state.translateUserInput = rawInput;
      state.translateSubmitted = true;
      state.totalAnswered++;

      let correct = false;
      if (item.direction === 'vi-to-hanzi') {
        correct = normalizeHanzi(rawInput) === normalizeHanzi(item.hanzi);
      } else {
        // Check exact tone match OR toneless pinyin match
        const cleanUser = rawInput.toLowerCase().replace(/\s+/g, ' ').trim();
        const cleanTarget = item.pinyin.toLowerCase().replace(/\s+/g, ' ').trim();
        correct = (cleanUser === cleanTarget) || (normalizePinyin(rawInput) === normalizePinyin(item.pinyin));
      }

      state.translateIsCorrect = correct;
      speakHanzi(item.hanzi);

      if (correct) {
        state.totalCorrect++;
        state.streak++;
        if (item.wordId) state.masteredIds.add(item.wordId);
      } else {
        state.streak = 0;
        if (item.wordId) {
          autoStarWord(item.wordId);
          state.masteredIds.delete(item.wordId);
          showToast(`Chưa chính xác! Đã tự động gắn sao ⭐ cho từ "${item.hanzi}"`, "warning");
        }
      }

      saveProgress();
      renderCurrentMode();
    }

              <button onclick="nextTranslateItem(); renderCurrentMode();" class="w-full sm:w-auto bg-ink hover:bg-stone-800 text-white font-semibold px-6 py-3 rounded-xl shadow-sm transition text-sm shrink-0">

    /**
     * ============================================================================
     * 6.5. MODE 4: MOUSE & TOUCH HANDWRITING PRACTICE (TẬP VIẾT HÁN TỰ)
     * ============================================================================
     */
    function extractHanziChars(hanziStr) {
      return hanziStr.replace(/[.…\s]/g, '').split('');
    }

    function nextWriteWord() {
      const deck = getFilteredDeck();
      if (deck.length === 0) {
        state.writeTarget = null;
        return;
      }
      if (state.sessionQueue.length === 0) {
        state.sessionQueue = shuffleArray(deck);
      }
      const target = state.sessionQueue.shift();
      state.writeTarget = target;
      state.writeChars = extractHanziChars(target.hanzi);
      state.writeStrokes = state.writeChars.map(() => []);
      state.writeChecked = false;
      state.writeShowHint = false;
      state.writeShowSentences = false;
    }

    function undoWriteStroke(boxIdx) {
      if (state.writeStrokes[boxIdx] && state.writeStrokes[boxIdx].length > 0) {
        state.writeStrokes[boxIdx].pop();
        redrawWriteCanvas(boxIdx);
      }
    }

    function clearWriteBox(boxIdx) {
      if (state.writeStrokes[boxIdx]) {
        state.writeStrokes[boxIdx] = [];
        redrawWriteCanvas(boxIdx);
      }
    }

    function clearAllWriteBoxes() {
      state.writeStrokes = state.writeChars.map(() => []);
      state.writeChecked = false;
      renderCurrentMode();
    }

    function checkWriteAnswer() {
      const totalStrokes = state.writeStrokes.reduce((acc, s) => acc + s.length, 0);
      if (totalStrokes === 0) {
        showToast("Bạn chưa viết nét nào lên ô lưới! Hãy dùng chuột viết thử nhé ✍️", "warning");
        return;
      }
      state.writeChecked = true;
      state.writeOverlayCompare = true;
      speakHanzi(state.writeTarget.hanzi);
      renderCurrentMode();
    }

    function submitWriteSelfEval(isCorrect) {
      const target = state.writeTarget;
      if (!target) return;

      state.totalAnswered++;
      if (isCorrect) {
        state.totalCorrect++;
        state.streak++;
        state.masteredIds.add(target.id);
        showToast(`Tuyệt vời! Đã ghi nhớ cách viết "${target.hanzi}" ✨`, "success");
      } else {
        state.streak = 0;
        autoStarWord(target.id);
        state.masteredIds.delete(target.id);
        const reinsertIdx = Math.min(2, state.sessionQueue.length);
        state.sessionQueue.splice(reinsertIdx, 0, target);
        showToast(`Đã tự động gắn sao ⭐ cho "${target.hanzi}" để luyện lại!`, "warning");
      }

      saveProgress();
      nextWriteWord();
      renderCurrentMode();
    }

    function redrawWriteCanvas(boxIdx) {
      const canvas = document.getElementById(`write-canvas-${boxIdx}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      if (rect.width === 0 || rect.height === 0) return;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const char = state.writeChars[boxIdx] || '';

      if ((state.writeGhostGuide && !state.writeChecked) || (state.writeChecked && state.writeOverlayCompare)) {
        ctx.save();
        ctx.font = `700 ${Math.floor(w * 0.72)}px "Noto Sans SC", "KaiTi", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (state.writeChecked && state.writeOverlayCompare) {
          ctx.fillStyle = 'rgba(200, 62, 59, 0.34)';
        } else {
          ctx.fillStyle = 'rgba(120, 113, 108, 0.22)';
        }
        ctx.fillText(char, w / 2, h / 2 + h * 0.03);
        ctx.restore();
      }

      const strokes = state.writeStrokes[boxIdx] || [];
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1E2022';
      ctx.lineWidth = state.writeBrushSize;

      strokes.forEach(stroke => {
        if (stroke.length === 0) return;
        ctx.beginPath();
        if (stroke.length === 1) {
          ctx.fillStyle = '#1E2022';
          ctx.arc(stroke[0].x * w, stroke[0].y * h, state.writeBrushSize / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.moveTo(stroke[0].x * w, stroke[0].y * h);
          for (let i = 1; i < stroke.length; i++) {
            const prev = stroke[i - 1];
            const curr = stroke[i];
            const midX = ((prev.x + curr.x) / 2) * w;
            const midY = ((prev.y + curr.y) / 2) * h;
            ctx.quadraticCurveTo(prev.x * w, prev.y * h, midX, midY);
          }
          const last = stroke[stroke.length - 1];
          ctx.lineTo(last.x * w, last.y * h);
          ctx.stroke();
        }
      });
      ctx.restore();
    }

    function bindWriteCanvases() {
      state.writeChars.forEach((_, boxIdx) => {
        const canvas = document.getElementById(`write-canvas-${boxIdx}`);
        if (!canvas) return;

        let isDrawing = false;
        let currentStroke = [];

        const getNormalizedPoint = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
            y: Math.max(0, Math.min(1, (clientY - rect.top) / rect.height))
          };
        };

        const startStroke = (e) => {
          if (e.cancelable) e.preventDefault();
          isDrawing = true;
          const pt = getNormalizedPoint(e);
          currentStroke = [pt];
          state.writeStrokes[boxIdx].push(currentStroke);
          redrawWriteCanvas(boxIdx);
        };

        const moveStroke = (e) => {
          if (!isDrawing) return;
          if (e.cancelable) e.preventDefault();
          const pt = getNormalizedPoint(e);
          currentStroke.push(pt);
          redrawWriteCanvas(boxIdx);
        };

        const endStroke = () => {
          if (!isDrawing) return;
          isDrawing = false;
          currentStroke = [];
        };

        canvas.addEventListener('mousedown', startStroke);
        canvas.addEventListener('mousemove', moveStroke);
        window.addEventListener('mouseup', endStroke);

        canvas.addEventListener('touchstart', startStroke, { passive: false });
        canvas.addEventListener('touchmove', moveStroke, { passive: false });
        canvas.addEventListener('touchend', endStroke);

        redrawWriteCanvas(boxIdx);
      });
    }

    /**
     * ============================================================================
     * 7. MODE 5: SPEED MATCH GAME (HANZI <-> MIXED PINYIN & VIETNAMESE)
     * ============================================================================

    function setupMatchGame() {
      if (state.matchInterval) clearInterval(state.matchInterval);
      const deck = getFilteredDeck();
      if (deck.length === 0) return;

      const pairCount = Math.min(6, deck.length);
      state.matchTotalPairs = pairCount;
      state.matchedPairsCount = 0;
      state.selectedCardIndex = null;
      state.matchTimer = 0;

      const selectedWords = shuffleArray(deck).slice(0, pairCount);
      const cards = [];

      selectedWords.forEach((word, idx) => {
        cards.push({
          uid: `h-${word.id}`,
          wordId: word.id,
          type: 'hanzi',
          display: word.hanzi,
          hanzi: word.hanzi,
          matched: false,
          error: false
        });

        const usePinyin = idx % 2 === 0;
        cards.push({
          uid: `m-${word.id}`,
          wordId: word.id,
          type: usePinyin ? 'pinyin' : 'meaning',
          display: usePinyin ? word.pinyin : word.meaning,
          subTag: usePinyin ? 'Pinyin' : 'Nghĩa Việt',
          hanzi: word.hanzi,
          matched: false,
          error: false
        });
      });

      state.matchCards = shuffleArray(cards);
      state.matchInterval = setInterval(() => {
        if (state.matchedPairsCount < state.matchTotalPairs && state.currentMode === 'match-game') {
          state.matchTimer++;
          const timerEl = document.getElementById('match-timer-display');
          if (timerEl) timerEl.textContent = `${state.matchTimer}s`;
        }
      }, 1000);
    }

    function handleMatchCardClick(index) {
      const card = state.matchCards[index];
      if (!card || card.matched) return;

      state.matchCards.forEach(c => c.error = false);

      if (card.type === 'hanzi') {
        speakHanzi(card.hanzi);
      }

      if (state.selectedCardIndex === index) {
        state.selectedCardIndex = null;
        renderCurrentMode();
        return;
      }

      if (state.selectedCardIndex === null) {
        state.selectedCardIndex = index;
        renderCurrentMode();
        return;
      }

      const prevIndex = state.selectedCardIndex;
      const prevCard = state.matchCards[prevIndex];

      if (prevCard.wordId === card.wordId && prevCard.uid !== card.uid) {
        prevCard.matched = true;
        card.matched = true;
        state.matchedPairsCount++;
        state.selectedCardIndex = null;
        state.streak++;
        state.totalAnswered++;
        state.totalCorrect++;
        state.masteredIds.add(card.wordId);
        saveProgress();

        if (state.matchedPairsCount === state.matchTotalPairs) {
          clearInterval(state.matchInterval);
          showToast(`Tuyệt vời! Hoàn thành trong ${state.matchTimer} giây! 🎉`, "success");
        }
      } else {
        prevCard.error = true;
        card.error = true;
        state.selectedCardIndex = null;
        state.streak = 0;
        state.totalAnswered++;
        autoStarWord(prevCard.wordId);
        autoStarWord(card.wordId);
        saveProgress();
      }

      renderCurrentMode();
    }

    function normalizePinyin(str) {
      return str
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ü/g, 'v')
        .replace(/[^a-z0-9]/g, '');
    }

    function normalizeHanzi(str) {
      return str.replace(/[\s.,?!。，？！…：:！!？?、]/g, '');
    }

    function initTranslateQueue() {
      state.translateQueue = shuffleArray([...TRANSLATION_PARAGRAPHS]);
      nextTranslateItem();
    }

    function nextTranslateItem() {
      if (state.translateQueue.length === 0) {
        initTranslateQueue();
        return;
      }
      const para = state.translateQueue.shift();
      let dir = state.translateModeType;
      if (dir === 'auto') {
        const dirs = ['hanzi-to-pinyin', 'vi-to-pinyin', 'vi-to-hanzi'];
        dir = dirs[state.totalAnswered % 3];
      }

      state.currentTranslateItem = { ...para, direction: dir };
      state.translateUserInputs = para.lines.map(() => '');
      state.translateSubmitted = false;
      state.translateLineResults = [];
      state.activeTranslateLineIdx = 0;
      state.hanziKeyboardPool = buildHanziKeyboardPool(para.lines);
    }

    function buildHanziKeyboardPool(lines) {
      // Extract all unique individual Hanzi characters in the paragraph (excluding punctuation)
      const charSet = new Set();
      lines.forEach(line => {
        const clean = line.hanzi.replace(/[\s.,?!。，？！…：:！!？?、a-zA-Z0-9]/g, '');
        for (const ch of clean) {
          charSet.add(ch);
        }
      });

      // Add 6 look-alike / distractor Hanzi characters from vocabulary so the user actively recognizes the right character
      const allChars = [];
      getAllVocab().forEach(w => {
        const cleanW = w.hanzi.replace(/[.…\s]/g, '');
        for (const ch of cleanW) {
          if (!charSet.has(ch)) allChars.push(ch);
        }
      });
      shuffleArray(allChars).slice(0, 6).forEach(ch => charSet.add(ch));

      return shuffleArray(Array.from(charSet));
    }

    function insertHanziFromKeyboard(ch) {
      const idx = state.activeTranslateLineIdx || 0;
      const input = document.getElementById(`translate-input-${idx}`);
      if (!input || state.translateSubmitted) return;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = input.value.slice(0, start) + ch + input.value.slice(end);
      state.translateUserInputs[idx] = input.value;
      input.focus();
      input.setSelectionRange(start + ch.length, start + ch.length);
    }

    function backspaceHanziKeyboard() {
      const idx = state.activeTranslateLineIdx || 0;
      const input = document.getElementById(`translate-input-${idx}`);
      if (!input || state.translateSubmitted) return;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      if (start !== end) {
        input.value = input.value.slice(0, start) + input.value.slice(end);
        input.setSelectionRange(start, start);
      } else if (start > 0) {
        input.value = input.value.slice(0, start - 1) + input.value.slice(start);
        input.setSelectionRange(start - 1, start - 1);
      }
      state.translateUserInputs[idx] = input.value;
      input.focus();
    }

    function clearLineHanziKeyboard() {
      const idx = state.activeTranslateLineIdx || 0;
      const input = document.getElementById(`translate-input-${idx}`);
      if (!input || state.translateSubmitted) return;
      input.value = '';
      state.translateUserInputs[idx] = '';
      input.focus();
    }

    function insertToneChar(ch) {
      const idx = state.activeTranslateLineIdx || 0;
      const input = document.getElementById(`translate-input-${idx}`);
      if (!input) return;
      const start = input.selectionStart || input.value.length;
      const end = input.selectionEnd || input.value.length;
      input.value = input.value.slice(0, start) + ch + input.value.slice(end);
      state.translateUserInputs[idx] = input.value;
      input.focus();
      input.setSelectionRange(start + ch.length, start + ch.length);
    }

    function speakFullParagraph(lines) {
      const fullText = lines.map(l => l.hanzi).join(' ');
      speakHanzi(fullText);
    }

    function submitTranslateAnswer() {
      if (state.translateSubmitted || !state.currentTranslateItem) return;
      const para = state.currentTranslateItem;

      // Sync values from DOM inputs
      para.lines.forEach((_, idx) => {
        const el = document.getElementById(`translate-input-${idx}`);
        if (el) state.translateUserInputs[idx] = el.value.trim();
      });

      const hasAnyInput = state.translateUserInputs.some(v => v.length > 0);
      if (!hasAnyInput) {
        showToast("Bạn hãy dịch ít nhất 1 câu trong đoạn văn trước khi kiểm tra nhé!", "warning");
        return;
      }

      state.translateSubmitted = true;
      let correctCount = 0;

      state.translateLineResults = para.lines.map((line, idx) => {
        const userVal = (state.translateUserInputs[idx] || '').trim();
        let isLineOk = false;
        if (userVal.length > 0) {
          if (para.direction === 'vi-to-hanzi') {
            isLineOk = normalizeHanzi(userVal) === normalizeHanzi(line.hanzi);
          } else {
            isLineOk = normalizePinyin(userVal) === normalizePinyin(line.pinyin);
          }
        }
        if (isLineOk) correctCount++;
        return isLineOk;
      });

      state.totalAnswered += para.lines.length;
      state.totalCorrect += correctCount;

      if (correctCount === para.lines.length) {
        state.streak++;
        showToast(`Xuất sắc! Bạn dịch đúng trọn vẹn ${correctCount}/${para.lines.length} câu! 🎉`, "success");
      } else {
        state.streak = 0;
        // Automatically star any vocabulary words appearing in incorrect lines!
        const allVocab = getAllVocab();
        para.lines.forEach((line, idx) => {
          if (!state.translateLineResults[idx]) {
            allVocab.forEach(w => {
              const cleanW = w.hanzi.replace(/\.\.\./g, '');
              if (cleanW.length >= 1 && line.hanzi.includes(cleanW)) {
                autoStarWord(w.id);
              }
            });
          }
        });
        showToast(`Đúng ${correctCount}/${para.lines.length} câu. Các từ ở câu sai đã tự động gắn sao ⭐!`, "warning");
      }

      saveProgress();
      renderCurrentMode();
    }

    /**
     * ============================================================================
     * 8. MODE 6: AI-POWERED ADD VOCABULARY (NHẬP PINYIN + TIẾNG VIỆT -> TỰ TÌM HÁN TỰ)
     * ============================================================================
     */
    async function fetchHanziFromPinyinAndMeaning(pinyin, meaning) {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const systemPrompt = `Bạn là giáo viên tiếng Trung giàu kinh nghiệm cho người Việt. Người dùng sẽ cung cấp Pinyin và Nghĩa tiếng Việt. Hãy xác định chính xác Chữ Hán (giản thể), Pinyin chuẩn có dấu thanh điệu, phân tích bộ thủ & mẹo nhớ mặt chữ sinh động bằng tiếng Việt, và tạo 2 câu giao tiếp mẫu tự nhiên (kèm Pinyin, nghĩa Việt và loại câu: Khẳng định / Phủ định / Nghi vấn).`;

      const userQuery = `Hãy tìm chữ Hán và tạo dữ liệu học tập cho từ sau:
- Pinyin người dùng nhập: "${pinyin}"
- Nghĩa tiếng Việt: "${meaning}"`;

      const payload = {
        contents: [{ parts: [{ text: userQuery }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              hanzi: { type: "STRING", description: "Chữ Hán giản thể chuẩn xác (chỉ gồm chữ Hán, không kèm pinyin)" },
              standardPinyin: { type: "STRING", description: "Pinyin chuẩn có đầy đủ dấu thanh điệu" },
              meaning: { type: "STRING", description: "Nghĩa tiếng Việt chuẩn xác, ngắn gọn" },
              hint: { type: "STRING", description: "Phân tích bộ thủ và mẹo nhớ mặt chữ bằng tiếng Việt" },
              confusables: {
                type: "ARRAY",
                items: { type: "STRING" },
                description: "2-3 chữ Hán có mặt chữ gần giống dễ nhầm lẫn"
              },
              sentences: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    hanzi: { type: "STRING" },
                    pinyin: { type: "STRING" },
                    vi: { type: "STRING" },
                    type: { type: "STRING", description: "Khẳng định, Phủ định, hoặc Nghi vấn" }
                  },
                  required: ["hanzi", "pinyin", "vi", "type"]
                },
                description: "2 câu giao tiếp mẫu tự nhiên có sử dụng từ này"
              }
            },
            required: ["hanzi", "standardPinyin", "meaning", "hint", "confusables", "sentences"]
          }
        }
      };

      const delays = [1000, 2000, 4000];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const result = await response.json();
          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error("Empty AI response");
          return JSON.parse(rawText);
        } catch (err) {
          if (attempt === delays.length) throw err;
          await new Promise(res => setTimeout(res, delays[attempt]));
        }
      }
    }

    async function handleAutoFindHanzi(e) {
      e.preventDefault();
      if (state.isLookingUpWord) return;

      const pinyin = document.getElementById('input-new-pinyin').value.trim();
      const meaning = document.getElementById('input-new-meaning').value.trim();

      if (!pinyin || !meaning) {
        showToast("Vui lòng nhập Pinyin và Nghĩa tiếng Việt trước nhé!", "warning");
        return;
      }

      state.isLookingUpWord = true;
      state.aiLookupPreview = null;
      renderCurrentMode();

      try {
        const data = await fetchHanziFromPinyinAndMeaning(pinyin, meaning);
        state.aiLookupPreview = data;
        showToast(`Đã tìm thấy chữ Hán: ${data.hanzi} (${data.standardPinyin})!`, "success");
      } catch (err) {
        showToast("Không thể kết nối AI lúc này, bạn có thể thử bấm lại nhé!", "error");
      } finally {
        state.isLookingUpWord = false;
        renderCurrentMode();
      }
    }

    function confirmSaveAiWord() {
      const data = state.aiLookupPreview;
      if (!data) return;

      const existing = getAllVocab().find(w => w.hanzi === data.hanzi);
      if (existing) {
        showToast(`Chữ "${data.hanzi}" đã có sẵn trong kho từ vựng (#${existing.id})!`, "warning");
        state.aiLookupPreview = null;
        renderCurrentMode();
        return;
      }

      const maxId = getAllVocab().reduce((max, w) => Math.max(max, w.id), 200);
      const newWord = {
        id: maxId + 1,
        sheet: 6,
        hanzi: data.hanzi,
        pinyin: data.standardPinyin,
        meaning: data.meaning,
        hint: data.hint,
        confusables: Array.isArray(data.confusables) ? data.confusables : [],
        customSentences: Array.isArray(data.sentences) ? data.sentences : []
      };

      state.customWords.unshift(newWord);
      state.aiLookupPreview = null;
      saveProgress();
      renderScopeFilters();
      speakHanzi(newWord.hanzi);
      showToast(`Đã lưu "${newWord.hanzi}" (${newWord.pinyin}) vào bộ từ vựng! 🎉`, "success");
      renderCurrentMode();
    }

      state.customWords = state.customWords.filter(w => w.id !== id);

      state.starredIds.delete(id);
      saveProgress();
      renderScopeFilters();
      showToast("Đã xóa từ tự nhập", "info");
      renderCurrentMode();
    }

                        <span>${isSentenceOpen ? 'Ẩn 2 câu mẫu' : 'Đặt câu với từ này'}</span>
                      </button>
                      <button onclick="toggleMastered(${w.id}, event)" class="text-[11px] font-semibold ${isMastered ? 'text-jade' : 'text-inkLight hover:text-ink'}">
                        ${isMastered ? '✓ Đã thuộc' : 'Đánh dấu thuộc'}
                      </button>
                    </div>

                    ${isSentenceOpen ? `
                      <div class="flex flex-col gap-1.5 pt-1 animate-pop">
                        ${sentences.map(s => `
                          <div class="bg-white p-2.5 rounded-xl border border-stone-200/80 text-xs">
                            <div class="flex items-center justify-between gap-1">
                              <span class="font-bold text-seal">${s.pinyin}</span>
                              <button onclick="speakHanzi('${s.hanzi.replace(/'/g, "\\'")}')" class="text-[11px] hover:scale-110 transition">🔊</button>
                            </div>
                            <div class="font-hanzi text-sm font-bold text-ink mt-0.5">${s.hanzi}</div>
                            <div class="text-[11px] text-inkLight">→ ${s.vi}</div>
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    /**
     * ============================================================================
     * 10. KEYBOARD SHORTCUTS (1-4 FOR OPTIONS, SPACE FOR AUDIO, ENTER FOR NEXT)
     * ============================================================================
     */
    document.addEventListener('keydown', (e) => {
      if (state.currentMode === 'quiz-hanzi' || state.currentMode === 'quiz-reverse') {
        if (!state.currentQuestion) return;
        if (['1', '2', '3', '4'].includes(e.key) && !state.quizAnswered) {
          const idx = parseInt(e.key, 10) - 1;
          if (state.currentQuestion.options[idx]) {
            handleQuizAnswer(state.currentQuestion.options[idx].id);
          }
        } else if (e.key === 'Enter' && state.quizAnswered) {
          nextQuestion();
          renderCurrentMode();
        } else if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          speakHanzi(state.currentQuestion.target.hanzi);
        }
      }
    });

    /**
     * ============================================================================
     * 11. INITIALIZE APPLICATION
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      updateHeaderStats();
      renderScopeFilters();
      initModeData();
      renderCurrentMode();
    });

    window.addEventListener('resize', () => {
      if (state.currentMode === 'write-hanzi') {
        state.writeChars.forEach((_, idx) => redrawWriteCanvas(idx));
      }
    });
  </script>
</body>
</html>
